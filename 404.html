<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сторінку не знайдено / Page Not Found | AGRO FEHYR</title>
    <style>
        :root{--primary-color:#2c5e1e;--accent-color:#a82020;--bg-color:#fcfbf9;--text-color:#333;--font-main:'Segoe UI',system-ui,-apple-system,sans-serif}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:var(--font-main);color:var(--text-color);background-color:var(--bg-color);line-height:1.6; display:flex; flex-direction:column; min-height:100vh;}
        .container{max-width:800px;margin:auto;padding:40px 20px;text-align:center;}
        .error-code{font-size:6rem;font-weight:700;color:var(--primary-color);margin-bottom:10px;line-height:1;}
        h1{font-size:2rem;margin-bottom:20px;}
        p{font-size:1.1rem;margin-bottom:30px;color:#555;}
        .btn{display:inline-block;background:var(--primary-color);color:#fff;padding:12px 25px;text-decoration:none;border-radius:6px;font-weight:bold;transition:0.3s;}
        .btn:hover{background:#1e4015;}
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>На жаль, цю сторінку не знайдено / Az oldal nem található</h1>
        <p>Можливо, вона була видалена, перейменована або тимчасово недоступна.<br>A keresett oldal törölve lett, vagy hibás címet gépeltél be.</p>
        <a href="/" class="btn">Повернутися на головну / Vissza a főoldalra</a>
    </div>
</body>
</html>
